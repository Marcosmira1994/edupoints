<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EduPoints — Ranking</title>
<link rel="stylesheet" href="ui.css">
<style>
html,body{margin:0;background:var(--ui-bg);color:var(--ui-text);font-family:var(--ui-sans);overflow-x:hidden}
.stage{position:relative;min-height:100vh;padding:28px 20px 56px;overflow:hidden;isolation:isolate}
.stage::before{content:"";position:absolute;inset:-20% -10% auto;height:90%;z-index:-2;background:radial-gradient(60% 60% at 50% 0%,rgba(0,245,255,.22),transparent 70%),radial-gradient(40% 50% at 85% 20%,rgba(255,77,255,.16),transparent 70%),radial-gradient(40% 50% at 12% 30%,rgba(127,255,0,.10),transparent 70%)}
.ring{position:absolute;border-radius:50%;border:1px dashed rgba(0,245,255,.35);z-index:-1}
.ring.r1{width:560px;height:560px;left:50%;top:-140px;margin-left:-280px}
.ring.r2{width:820px;height:820px;left:50%;top:-270px;margin-left:-410px;border-color:rgba(255,77,255,.22);animation-direction:reverse}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;max-width:1100px;margin:0 auto;flex-wrap:wrap}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:999px;border:1px solid var(--ui-border);background:transparent;color:var(--ui-muted);font:700 13px var(--ui-display);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:all .3s ease}
.tab[aria-selected=true]{background:var(--ui-accent);color:var(--ui-on-accent);border-color:var(--ui-accent)}
h1{margin:36px 0 4px;text-align:center;font:800 clamp(44px,9vw,104px)/.95 var(--ui-display);letter-spacing:.02em;text-transform:uppercase;background:linear-gradient(90deg,#fff,var(--ui-accent),var(--ui-accent-2),#fff);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:ep-shine 6s linear infinite}
.lead{text-align:center;color:var(--ui-muted);margin:0 0 20px}
.ep-art .crown{position:absolute;top:8px;left:12px;font-size:30px;animation:ep-float 3s ease-in-out infinite;z-index:3;filter:drop-shadow(0 4px 10px rgba(255,215,0,.5))}
.ep-cf .ep-card{cursor:pointer}
.ep-cf .ep-card.active{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 20px 60px color-mix(in srgb,var(--c) 30%,transparent)}
.ep-cf .ep-avatar{width:76px;height:76px;font-size:32px}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:12px;max-width:640px;margin:34px auto 0;height:230px}
.pd{flex:1;max-width:200px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center;--c:var(--ui-accent)}
.pd.p1{--c:var(--ui-gold)}.pd.p2{--c:var(--ui-accent)}.pd.p3{--c:var(--ui-accent-2)}
.pd .nm{font:700 15px var(--ui-display);margin-bottom:2px}.pd .xp{font:800 22px var(--ui-display);color:var(--c);margin-bottom:8px}
.pd .bar{width:100%;border-radius:14px 14px 0 0;transform-origin:bottom;animation:ep-rise 1.1s var(--ui-ease) both;border:1px solid var(--c);border-bottom:0;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 45%,transparent),color-mix(in srgb,var(--c) 6%,transparent));display:grid;place-items:start center;padding-top:10px;font:800 34px var(--ui-display);color:var(--c)}
.p1 .bar{height:150px;animation-delay:.5s}.p2 .bar{height:110px;animation-delay:.25s}.p3 .bar{height:80px}
.list{max-width:760px;margin:34px auto 0;display:grid;gap:10px}
.row{display:grid;grid-template-columns:48px 44px 1fr auto;gap:14px;align-items:center;padding:10px 16px;background:var(--ui-surface);border:1px solid var(--ui-border);border-radius:var(--ui-r-md);transition:all .5s ease}
.row:hover{border-color:var(--ui-accent);transform:translateX(6px);box-shadow:0 8px 24px rgba(0,245,255,.10)}
.row .pos{font:800 22px var(--ui-display);color:var(--ui-muted)}
.row .av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:800 18px var(--ui-display);border:2px solid var(--ui-border-input);color:var(--ui-text)}
.row .n{font:700 16px var(--ui-display)}.row .t{font-size:13px;color:var(--ui-muted)}
.row .v{font:800 20px var(--ui-display);color:var(--ui-lime)}
.up{color:var(--ui-lime);font:700 12px var(--ui-display)}
@media(max-width:560px){.ep-cf{height:400px}.podium{height:200px}.row{grid-template-columns:36px 40px 1fr auto;gap:10px}}
</style></head><body>
<main class="stage">
<div class="ring r1 ep-spin"></div><div class="ring r2 ep-spin"></div>
<div class="top"><span class="ui-eyebrow">Colégio Gaia · 6º Ano</span>
<div class="tabs" role="tablist" aria-label="Período"><button class="tab" role="tab" aria-selected="true" data-k="semana">Semana</button><button class="tab" role="tab" aria-selected="false" data-k="bimestre">Bimestre</button><button class="tab" role="tab" aria-selected="false" data-k="evoluiu">Mais evoluíram</button></div></div>
<h1>Ranking</h1><p class="lead" id="lead">Quem mais brilhou nesta semana</p>
<section class="ep-cf" id="cf" aria-label="Destaques"><div class="ep-cf-track" id="track"></div></section>
<div class="ep-cf-nav"><button class="ui-icon-btn" id="prev" aria-label="Anterior">‹</button><button class="ui-icon-btn" id="next" aria-label="Próximo">›</button></div>
<div class="podium" id="podium" aria-label="Pódio"></div>
<div class="list" id="list"></div>
</main>
<script>
var ND=[["Ana Souza",1240,5,"#7fff00"],["Bruno Lima",980,3],["Clara Dias",905,4],["Davi Rocha",840,2],["Elisa Nunes",760,3],["Fábio Alves",710,1],["Gabi Torres",655,2],["Hugo Reis",610,2],["Íris Melo",560,1],["João Pires",500,1]];
var DATA={semana:ND,bimestre:ND.map(function(a,i){return [a[0],a[1]*6-i*37,a[2]+4]}).sort(function(a,b){return b[1]-a[1]}),evoluiu:ND.slice().reverse().map(function(a,i){return [a[0],120+i*45,a[2]]})};
var LEAD={semana:"Quem mais brilhou nesta semana",bimestre:"O acumulado do bimestre",evoluiu:"Quem mais evoluiu em relação ao período anterior"};
var COLORS=["","c2","c3","c4"];var cur=0,list=DATA.semana,timer;
var reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
function fmt(n){return n.toLocaleString("pt-BR")}
function count(el,to){if(reduce){el.textContent=fmt(to);return}var t0=performance.now();(function f(t){var p=Math.min(1,(t-t0)/1200);el.textContent=fmt(Math.round(to*(1-Math.pow(1-p,3))));if(p<1)requestAnimationFrame(f)})(t0)}
function build(){var tr=document.getElementById("track");tr.innerHTML="";
list.slice(0,7).forEach(function(a,i){var c=document.createElement("article");c.className="ep-card aluno "+COLORS[i%4];c.dataset.i=i;
c.innerHTML='<div class="ep-art">'+(i===0?'<span class="crown" aria-hidden="true">👑</span>':'')+'<span class="ep-badge">#'+(i+1)+'</span><div class="ep-avatar">'+a[0][0]+'</div></div><div class="ep-body"><span class="ep-lvl">Nível '+(Math.floor(a[1]/300)+1)+'</span><h3 class="ep-title">'+a[0]+'</h3><div class="ui-bar ep-bar"><i style="width:'+(30+(a[1]%60))+'%"></i></div><div class="ep-stats"><div><b>'+fmt(a[1])+'</b><span>XP</span></div><div><b>'+a[2]+'</b><span>Semanas</span></div><div><b>'+Math.round(a[1]/14)+'</b><span>Moedas</span></div></div></div>';
c.onclick=function(){go(i)};tr.appendChild(c)});place();
var p=document.getElementById("podium");p.innerHTML="";[1,0,2].forEach(function(i){var a=list[i];var d=document.createElement("div");d.className="pd p"+(i+1);d.innerHTML='<div class="nm">'+a[0]+'</div><div class="xp" data-v="'+a[1]+'">0</div><div class="bar">'+(i+1)+'º</div>';p.appendChild(d)});
p.querySelectorAll(".xp").forEach(function(e){count(e,+e.dataset.v)});
var L=document.getElementById("list");L.innerHTML="";list.slice(3).forEach(function(a,i){var r=document.createElement("div");r.className="row reveal";r.style.transitionDelay=(i*70)+"ms";
r.innerHTML='<span class="pos">'+(i+4)+'</span><span class="av">'+a[0][0]+'</span><div><div class="n">'+a[0]+'</div><div class="t">6º Ano · '+a[2]+' semanas seguidas</div></div><div class="v">'+fmt(a[1])+' XP</div>';L.appendChild(r);setTimeout(function(){r.classList.add("in")},80)})}
function place(){var n=document.querySelectorAll("#track .ep-card"),w=innerWidth<560?150:230;
n.forEach(function(c,i){var d=i-cur,ad=Math.abs(d);c.classList.toggle("active",d===0);
c.style.transform="translateX("+(d*w)+"px) translateZ("+(-ad*140)+"px) rotateY("+(-Math.sign(d)*Math.min(ad,2)*26)+"deg) scale("+(d===0?1.04:.92)+")";
c.style.opacity=ad>2?0:1-ad*.22;c.style.zIndex=10-ad;c.style.pointerEvents=ad>2?"none":"auto"})}
function go(i){var m=Math.min(7,list.length);cur=(i+m)%m;place()}
function auto(){clearInterval(timer);if(!reduce)timer=setInterval(function(){go(cur+1)},3500)}
document.getElementById("next").onclick=function(){go(cur+1);auto()};document.getElementById("prev").onclick=function(){go(cur-1);auto()};
addEventListener("keydown",function(e){if(e.key==="ArrowRight")go(cur+1);if(e.key==="ArrowLeft")go(cur-1)});addEventListener("resize",place);
var sx=null;var cf=document.getElementById("cf");cf.addEventListener("touchstart",function(e){sx=e.touches[0].clientX},{passive:true});cf.addEventListener("touchend",function(e){if(sx===null)return;var dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>40){go(cur+(dx<0?1:-1));auto()}sx=null});
document.querySelectorAll(".tab").forEach(function(t){t.onclick=function(){document.querySelectorAll(".tab").forEach(function(x){x.setAttribute("aria-selected",x===t)});list=DATA[t.dataset.k];document.getElementById("lead").textContent=LEAD[t.dataset.k];cur=0;build();auto()}});
build();auto();
</script></body></html>
